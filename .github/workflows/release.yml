name: Release

# 发布流程（详见 RELEASE.md）：推送 v* 标签触发——
#   1) mvn -P release deploy：测试全量 + 发布 promql-core / prometheus-api 的
#      jar/sources/javadoc 到 GitHub Packages（promql-bench 经 maven.deploy.skip
#      排除）；setup-java 的 server-id: github 注入 GITHUB_ACTOR/GITHUB_TOKEN。
#   2) gh release create：建 GitHub Release 页并自动生成变更说明。
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: github # 与父 pom distributionManagement/repository/id 对应
      - name: Test & deploy to GitHub Packages
        run: mvn -B -ntp -P release deploy
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
